<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco Print Toolbox - 植物移印染工具箱</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="wrap">
  <h1>Eco Print Toolbox</h1>
  <p class="sub">植物移印染工具箱 — 配方計算、參數速查，依巨人染課程單元擴充。</p>
  <div class="grid">
    <a class="tool-card" href="unit1-wool-mordant/index.html">
      <h2>單元一・羊毛媒染計算機</h2>
      <p>精練清潔劑、媒染明礬與綠礬用量（羊毛與鮮花）</p>
    </a>
    <a class="tool-card" href="unit2-wool-dye-blanket/index.html">
      <h2>單元二・羊毛色蓋布計算機</h2>
      <p>精練、媒染，加上色蓋布染液萃取用量（羊毛與色蓋布）</p>
    </a>
    <a class="tool-card" href="unit3-cotton-iron-blanket/index.html">
      <h2>單元三・棉布＋鐵蓋布媒染計算機</h2>
      <p>精練、本布媒染、鐵蓋布媒染三段式計算（棉布染色鐵化）</p>
    </a>
    <a class="tool-card" href="unit4-silk-mordant/index.html">
      <h2>單元四・絲媒染與色蓋布計算機</h2>
      <p>媒染，加上兩種染液（石榴皮／茜草）萃取用量（絲與媒色蓋布）</p>
    </a>
  </div>
</div>
</body>
</html>
